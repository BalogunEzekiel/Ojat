services:

  # =========================================================
  # OJAT API
  # =========================================================
  - type: web
    name: ojat-api
    runtime: node
    rootDir: server

    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy

    startCommand: npm start

    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        sync: false

      - key: REDIS_URL
        sync: false

      - key: CLIENT_URL
        sync: false

      - key: JWT_ACCESS_SECRET
        generateValue: true

      - key: JWT_REFRESH_SECRET
        generateValue: true

      - key: ACCESS_TOKEN_EXPIRES_IN
        value: 15m

      - key: REFRESH_TOKEN_EXPIRES_IN
        value: 7d

      # -------------------------
      # GROQ
      # -------------------------
      - key: GROQ_API_KEY_1
        sync: false

      - key: GROQ_API_KEY_2
        sync: false

      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1

      - key: GROQ_MODEL_NAME
        value: openai/gpt-oss-120b

      - key: GROQ_TRANSCRIPTION_MODEL
        value: whisper-large-v3

      # -------------------------
      # WHATSAPP / META
      # -------------------------
      - key: WHATSAPP_GRAPH_VERSION
        value: v26.0

      - key: WHATSAPP_VERIFY_TOKEN
        sync: false

      - key: WHATSAPP_ACCESS_TOKEN
        sync: false

      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false

      - key: WHATSAPP_APP_SECRET
        sync: false

      # -------------------------
      # PAYSTACK
      # -------------------------
      - key: PAYSTACK_SECRET_KEY
        sync: false

      - key: PAYSTACK_PUBLIC_KEY
        sync: false

      # -------------------------
      # CLOUDINARY
      # -------------------------
      - key: CLOUDINARY_CLOUD_NAME
        sync: false

      - key: CLOUDINARY_API_KEY
        sync: false

      - key: CLOUDINARY_API_SECRET
        sync: false

      - key: CLOUDINARY_FOLDER
        value: ojat-prod


  # =========================================================
  # OJAT WHATSAPP / BULLMQ WORKER
  # =========================================================
  - type: worker
    name: ojat-worker
    runtime: node
    rootDir: server

    buildCommand: npm install && npx prisma generate

    startCommand: node src/workers/whatsapp.worker.js

    envVars:
      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        sync: false

      - key: REDIS_URL
        sync: false

      # -------------------------
      # GROQ
      # -------------------------
      - key: GROQ_API_KEY_1
        sync: false

      - key: GROQ_API_KEY_2
        sync: false

      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1

      - key: GROQ_MODEL_NAME
        value: openai/gpt-oss-120b

      - key: GROQ_TRANSCRIPTION_MODEL
        value: whisper-large-v3

      # -------------------------
      # WHATSAPP / META
      # -------------------------
      - key: WHATSAPP_GRAPH_VERSION
        value: v26.0

      - key: WHATSAPP_ACCESS_TOKEN
        sync: false

      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false

      - key: WHATSAPP_APP_SECRET
        sync: false

      # -------------------------
      # CLOUDINARY
      # -------------------------
      - key: CLOUDINARY_CLOUD_NAME
        sync: false

      - key: CLOUDINARY_API_KEY
        sync: false

      - key: CLOUDINARY_API_SECRET
        sync: false

      - key: CLOUDINARY_FOLDER
        value: ojat-prod


  # =========================================================
  # OJAT CLIENT
  # =========================================================
  - type: web
    name: ojat-client
    runtime: static
    rootDir: client

    buildCommand: npm install && npm run build

    staticPublishPath: dist

    envVars:
      - key: VITE_API_URL
        sync: false
