services:

  # ==========================================
  # OJAT API
  # ==========================================

  - type: web
    name: ojat-api
    runtime: node
    rootDir: server

    buildCommand: |
      npm install
      npx prisma generate
      npx prisma migrate deploy

    startCommand: npm start

    healthCheckPath: /health

    envVars:

      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        sync: false

      - key: JWT_ACCESS_SECRET
        generateValue: true

      - key: JWT_REFRESH_SECRET
        generateValue: true

      - key: REDIS_URL
        sync: false

      - key: CLIENT_URL
        sync: false

      - key: GROQ_API_KEY_1
        sync: false

      - key: GROQ_API_KEY_2
        sync: false

      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1

      - key: GROQ_MODEL_NAME
        value: openai/gpt-oss-120b

      - key: WHATSAPP_VERIFY_TOKEN
        sync: false

      - key: WHATSAPP_ACCESS_TOKEN
        sync: false

      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false

      - key: WHATSAPP_APP_SECRET
        sync: false

      - key: PAYSTACK_SECRET_KEY
        sync: false

      - key: PAYSTACK_PUBLIC_KEY
        sync: false

      - key: CLOUDINARY_CLOUD_NAME
        sync: false

      - key: CLOUDINARY_API_KEY
        sync: false

      - key: CLOUDINARY_API_SECRET
        sync: false

      - key: CLOUDINARY_FOLDER
        value: ojat-prod


  # ==========================================
  # WHATSAPP WORKER
  # ==========================================

  - type: worker
    name: ojat-whatsapp-worker
    runtime: node
    rootDir: server

    buildCommand: |
      npm install
      npx prisma generate

    startCommand: node src/workers/whatsapp.worker.js

    envVars:

      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        sync: false

      - key: REDIS_URL
        sync: false

      - key: GROQ_API_KEY_1
        sync: false

      - key: GROQ_API_KEY_2
        sync: false

      - key: WHATSAPP_ACCESS_TOKEN
        sync: false

      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false


  # ==========================================
  # FRONTEND
  # ==========================================

  - type: web
    name: ojat-web
    runtime: static
    rootDir: client

    buildCommand: npm install && npm run build

    staticPublishPath: dist
